version: "3.8"

services:
  product-workbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: product-workbench:latest
    container_name: product-workbench
    restart: unless-stopped
    ports:
      - "9030:9030"
    volumes:
      # 使用 Docker named volume 持久化，数据落在 /var/lib/docker 所在分区的本地文件系统上，
      # 不经过宿主机目录绑定（bind mount）。原因：SQLite 的 WAL 模式依赖共享内存映射与
      # 可靠的文件锁，在 NFS / SMB / FUSE 等共享文件系统上会直接抛 disk I/O error 导致启动失败。
      - workbench-storage:/app/storage
    environment:
      - PORT=9030
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9030/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # 固定卷名（不叠加 compose 项目名前缀），保证 deploy.sh 里的 docker run
  # 与本文件使用同一个卷，两种方式来回切换时数据不丢。
  workbench-storage:
    name: workbench-storage
